    <h1>Gouki Tools</h1>
    <p>片桐豪生（GoukiKatagiri）が自分の作業のために使う、個人用の小さな自動化ツール群です。一般には提供していません。</p>

    <h2>mailwatch</h2>
    <p>開発者本人の Gmail アカウントに届くメールのうち、クラウドソーシングの案件や取引相手からの連絡に関するものだけを読み取り、要点を開発者本人に Telegram で知らせるツールです。Gmail へのアクセスは読み取り専用で、メールの送信・削除・変更は行いません。</p>

    <h2>Google カレンダー連携</h2>
    <p>開発者本人のカレンダーの予定を、本人の指示に応じて照会・登録するツールです。</p>
